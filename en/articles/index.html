<script>
"use strict";
function toggleLang(){
  const h=document.documentElement, en=h.getAttribute('lang')==='en';
  h.setAttribute('lang', en?'ar':'en');
  h.setAttribute('dir',  en?'rtl':'ltr');
  document.getElementById('langBtn').textContent = en?'EN':'ع';
  try{ localStorage.setItem('gallery_lang', en?'ar':'en'); }catch(e){}
  render();
}
try{ if(/*i18n*/null==='en'){
  const h=document.documentElement; h.setAttribute('lang','en'); h.setAttribute('dir','ltr');
} }catch(e){}

const AR_M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const EN_M=['January','February','March','April','May','June','July','August','September','October','November','December'];
let DATA=[];
function fmt(d,en){ const [y,m,dd]=d.split('-').map(Number);
  return `${dd} ${(en?EN_M:AR_M)[m-1]} ${y}`; }

function render(){
  const en=document.documentElement.getAttribute('lang')==='en';
  const el=document.getElementById('list');
  if(!DATA.length){ document.getElementById('empty').hidden=false; return; }
  el.innerHTML=DATA.map(a=>`
    <a class="post" href="${a.slug}.html">
      <div class="top"><span class="ico">${a.icon||'📄'}</span><span class="date">${fmt(a.date,en)}</span></div>
      <h2>${en?a.title_en:a.title_ar}</h2>
      <p>${en?a.desc_en:a.desc_ar}</p>
      <span class="more">${en?'Read the guide →':'اقرأ الدليل ←'}</span>
    </a>`).join('');
}

fetch('/data/articles.json')
  .then(r=>r.json())
  .then(j=>{ DATA=j.articles||[]; render(); })
  .catch(()=>{ document.getElementById('empty').hidden=false; });

document.getElementById('langBtn').textContent =
  document.documentElement.getAttribute('lang')==='en' ? 'ع' : 'EN';
</script>
